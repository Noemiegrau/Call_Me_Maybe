[project]
name = "call-me-maybe"
version = "0.1.0"
description = "Function calling in LLMs via constrained decoding"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "numpy>=1.24.0",
    "llm-sdk",
]

[dependency-groups]
dev = [
    "flake8>=6.0.0",
    "mypy>=1.0.0",
    "pytest>=7.0.0",
]

[tool.uv.sources]
llm-sdk = { path = "llm_sdk" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.mypy]
exclude = ["llm_sdk/", "moulinette/", "\\.venv/"]
